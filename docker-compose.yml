services:
  postgres:
    image: postgres:16-alpine
    container_name: personelpanel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: personelpanel
      POSTGRES_PASSWORD: personelpanel123
      POSTGRES_DB: personelpanel2
    ports:
      - "5433:5432"
    volumes:
      - personelpanel_pgdata:/var/lib/postgresql/data

volumes:
  personelpanel_pgdata:
